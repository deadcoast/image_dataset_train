[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "image-dataset-train"
version = "0.2.0"
description = "Local, source-preserving image dataset preparation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pillow>=12.0,<13"]

[project.optional-dependencies]
tag-cpu = ["numpy>=2,<3", "onnxruntime>=1.20,<2", "huggingface-hub>=1,<2"]
tag-gpu = ["numpy>=2,<3", "onnxruntime-gpu>=1.20,<2", "huggingface-hub>=1,<2"]

[project.scripts]
dataset = "image_dataset_train.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "onnx>=1.18,<2"]

[tool.uv]
conflicts = [[{ extra = "tag-cpu" }, { extra = "tag-gpu" }]]

[tool.hatch.build.targets.wheel]
packages = ["src/image_dataset_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["OVERVIEW.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
