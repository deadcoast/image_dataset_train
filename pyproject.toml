[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "image-dataset-train"
version = "0.1.0"
description = "Local, source-preserving image dataset preparation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pillow>=12.0,<13"]

[project.scripts]
dataset = "image_dataset_train.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/image_dataset_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
