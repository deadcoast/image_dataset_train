# Only implemented settings belong here. Paths are relative to this file.
schema_version = 1

[paths]
source = "data/00_inbox"
runs = "data/runs"
models = "data/models"
scores = "data/derived/scores"
reviews = "data/reviews"
exports = "data/exports"

[export]
validation_ratio = 0.05
seed = 20261011
resolution = 1024
repeats = 1
split_strategy = "semantic"

[validation]
# Resolution concerns are review flags, not destructive rejection rules.
min_short_side = 768
max_long_side = 4096
# Decode limits are separate from training-resolution preferences.
max_decode_pixels = 50000000
max_file_bytes = 268435456

[tagging]
# Also supported: vit-large-v3, eva02-large-v3. Each uses a pinned revision.
model = "swinv2-v3"
device = "auto"
batch_size = 4

[captions]
# Omit general_threshold to use the model profile: 0.35 for Swin/ViT,
# 0.5296 for EVA02. These are initial settings, not calibrated guarantees.
character_threshold = 0.85
keep_characters = false
uncertainty_margin = 0.05
drop_tags = []
# Explicit caption phrases; empty defaults preserve model-only caption output.
trigger = ""
force_tags = []
# Optional [[captions.subset_rules]] tables are documented in docs/TAGGING.md.

[captions.tag_thresholds]
# Optional overrides use exact CSV names, e.g. blue_hair = 0.5
